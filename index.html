<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZNET Absensi</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="login-box">

        <div class="logo">
            <i class="fa-solid fa-wifi"></i>
        </div>

        <h1>AZNET ABSENSI</h1>

        <p class="subtitle">
            Sistem Absensi Karyawan
        </p>

        <!-- Username -->
        <div class="input-box">

            <i class="fa-solid fa-user"></i>

            <input
                type="text"
                id="username"
                placeholder="Username">

        </div>

        <!-- Password -->
        <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input
                type="password"
                id="password"
                placeholder="Password">

            <span id="lihatPassword">
                <i class="fa-solid fa-eye"></i>
            </span>

        </div>

        <div class="opsi">

            <label>

                <input type="checkbox">

                Ingat Saya

            </label>

            <a href="#">Lupa Password?</a>

        </div>

        <button id="loginBtn">

            <i class="fa-solid fa-right-to-bracket"></i>

            MASUK

        </button>

        <div class="footer">

            © 2026 AZNET Technology

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
