<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Statistik</title>

<link rel="stylesheet" href="css/statistik.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="header">

<h1>📊 Statistik Kehadiran</h1>

<a href="dashboard.html" class="back">
<i class="fa fa-arrow-left"></i>
Dashboard
</a>

</div>

<div class="cards">

    <div class="stat-card hadir">

        <div class="icon">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <h1 id="hadir">0</h1>

        <p>Hadir</p>

    </div>

    <div class="stat-card terlambat">

        <div class="icon">
            <i class="fa-solid fa-clock"></i>
        </div>

        <h1 id="terlambat">0</h1>

        <p>Terlambat</p>

    </div>

    <div class="stat-card alpha">

        <div class="icon">
            <i class="fa-solid fa-circle-xmark"></i>
        </div>

        <h1 id="alpha">0</h1>

        <p>Alpha</p>

    </div>

</div>

<div class="progress-box">

    <div class="title">

        <h2>
            📈 Progress Kehadiran
        </h2>

        <span>Bulan Ini</span>

    </div>

    <div class="progress">

        <div
            class="progress-bar"
            id="progressBar">
        </div>

    </div>

    <h3 id="persen">

        0% Kehadiran

    </h3>

</div>

<div class="summary-box">

    <h2>📋 Ringkasan Kehadiran</h2>

    <div class="summary-grid">

        <div class="summary-item">
            <span>Total Karyawan</span>
            <b id="totalKaryawan">0</b>
        </div>

        <div class="summary-item">
            <span>Hadir Hari Ini</span>
            <b id="hadirHariIni">0</b>
        </div>

        <div class="summary-item">
            <span>Belum Absen</span>
            <b id="belumAbsen">0</b>
        </div>

        <div class="summary-item">
            <span>Izin / Cuti</span>
            <b id="izinHariIni">0</b>
        </div>

        <div class="summary-item">
            <span>Persentase Kehadiran</span>
            <b id="persentase">0%</b>
        </div>

    </div>

</div>

<script src="js/statistik.js"></script>

</body>
</html>
