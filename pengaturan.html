<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengaturan</title>

<link rel="stylesheet" href="css/pengaturan.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="header">

<h1>
<i class="fa-solid fa-gear"></i>
Pengaturan
</h1>

<a href="dashboard.html" class="back">
<i class="fa-solid fa-arrow-left"></i>
Dashboard
</a>

</div>

<p class="subtitle">
Kelola aplikasi AZNET Attendance
</p>


<div class="card">

<div class="setting-item">

<div class="left">

<div class="icon blue">
<i class="fa-solid fa-moon"></i>
</div>

<div>

<h3>Dark Mode</h3>

<small>Tampilan lebih nyaman di malam hari</small>

</div>

</div>

<label class="switch">

<input type="checkbox" id="darkToggle">

<span class="slider"></span>

</label>

</div>


<div class="setting-item">

<div class="left">

<div class="icon red">
<i class="fa-solid fa-trash"></i>
</div>

<div>

<h3>Reset Data Absensi</h3>

<small>Menghapus seluruh riwayat absensi</small>

</div>

</div>

<button id="resetAbsen" class="danger">

Reset

</button>

</div>


<div class="setting-item">

<div class="left">

<div class="icon orange">
<i class="fa-solid fa-user"></i>
</div>

<div>

<h3>Reset Profil</h3>

<small>Menghapus data profil</small>

</div>

</div>

<button id="resetProfil" class="danger">

Reset

</button>

</div>


<div class="setting-item">

<div class="left">

<div class="icon green">
<i class="fa-solid fa-right-from-bracket"></i>
</div>

<div>

<h3>Logout</h3>

<small>Keluar dari aplikasi</small>

</div>

</div>

<button id="logout">

Logout

</button>

</div>

</div>

</div>

<script src="js/pengaturan.js"></script>

</body>

</html>
