<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lembur</title>

<link rel="stylesheet" href="css/lembur.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <h1>
            🕐 Lembur
        </h1>

<button type="button" id="btnKembali" class="back">
    <i class="fa-solid fa-arrow-left"></i>
    <span id="textKembali">Kembali</span>
</button>

    </div>


    <!-- =========================
         FORM PENGAJUAN
    ========================== -->

    <div class="card">

        <h2>
            Ajukan Lembur
        </h2>


        <!-- NAMA -->

        <div class="input-group">

            <label>
                Nama
            </label>

            <input
                type="text"
                id="nama"
                readonly>

        </div>


        <!-- TANGGAL -->

        <div class="input-group">

            <label>
                Tanggal Lembur
            </label>

            <input
                type="date"
                id="tanggal">

        </div>


        <!-- JAM -->

        <div class="row">

            <div class="input-group">

                <label>
                    Jam Mulai
                </label>

                <input
                    type="time"
                    id="jamMulai">

            </div>


            <div class="input-group">

                <label>
                    Jam Selesai
                </label>

                <input
                    type="time"
                    id="jamSelesai">

            </div>

        </div>


        <!-- ALASAN -->

        <div class="input-group">

            <label>
                Pekerjaan / Alasan Lembur
            </label>

            <textarea
                id="alasan"
                rows="5"
                placeholder="Jelaskan pekerjaan yang dilakukan saat lembur..."></textarea>

        </div>


        <!-- INFO NOMINAL -->

        <div class="info-nominal">

            <i class="fa-solid fa-circle-info"></i>

            <span>
                Nominal uang lembur ditentukan oleh Admin setelah pengajuan.
            </span>

        </div>


        <!-- BUTTON -->

        <button
            id="kirim">

            <i class="fa-solid fa-paper-plane"></i>

            Ajukan Lembur

        </button>

    </div>


    <!-- =========================
         RIWAYAT
    ========================== -->

    <div class="riwayat">

        <h2>
            Riwayat Lembur
        </h2>

        <div id="listRiwayat"></div>

    </div>

</div>


<!-- =========================
     MODAL DETAIL
========================== -->

<div
    class="modal"
    id="modalDetail">

    <div class="modal-content">

        <button
            class="close"
            onclick="tutupDetail()">

            ✖

        </button>

        <h2>
            Detail Lembur
        </h2>

        <div id="detailLembur"></div>

    </div>

</div>


<script src="js/lembur.js"></script>

</body>

</html>
